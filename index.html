<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>BAOS 공정 CHECKER</title>
<meta name="description" content="BAOS 공정 CHECKER - 재단 공정 CHECKER · 공정 기계 적용 범위 CHECKER">
<meta name="theme-color" content="#b5122b">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" sizes="32x32" href="icons/favicon-32.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="BAOS CHECKER">
<style>
:root{--red:#b5122b;--red2:#dc1f3c;--orange:#e8892e;--beige:#bcb09c;--maroon:#4a1d22;--bg:#f4f1ec;--line:#e7e0d5;--ink:#2b2325;--muted:#8c827b;
  --font:"Times New Roman",Times,"Malgun Gothic","맑은 고딕","Apple SD Gothic Neo","Noto Sans KR",serif}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--font);font-size:14px}
.wrap{max-width:1180px;margin:0 auto;padding:10px;padding-left:max(10px,env(safe-area-inset-left));padding-right:max(10px,env(safe-area-inset-right))}
.stripe{height:4px;display:flex;border-radius:2px 2px 0 0;overflow:hidden}.stripe i{flex:1}
header{background:#fff;border:1px solid var(--line);border-top:none;display:flex;align-items:center;gap:18px;padding:14px 20px;flex-wrap:wrap}
header img{height:46px;width:auto}
header h1{margin:0;font-size:22px;font-weight:700;letter-spacing:-.2px}
.meta{color:var(--muted);font-size:12px;margin-top:3px}.meta b{color:var(--ink);font-weight:600}
.lead{margin:22px 4px 12px;display:flex;align-items:baseline;gap:12px;flex-wrap:wrap}
.lead h2{margin:0;font-size:20px;color:var(--red)}
.lead p{margin:0;color:var(--muted)}
.man{margin-left:auto;display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);background:#fff;color:var(--maroon);text-decoration:none;padding:7px 12px;border-radius:4px;font-weight:700;font-size:13.5px}.man:hover{border-color:var(--red);color:var(--red)}
.cards{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.card{position:relative;display:flex;flex-direction:column;background:#fff;border:1px solid var(--line);border-radius:6px;padding:20px 20px 18px;text-decoration:none;color:inherit;overflow:hidden;transition:transform .15s,box-shadow .15s,border-color .15s}
.card::before{content:"";position:absolute;inset:0 0 auto 0;height:4px;background:linear-gradient(90deg,var(--red),var(--red2))}
.card:hover,.card:focus-visible{transform:translateY(-3px);box-shadow:0 10px 24px rgba(74,29,34,.13);border-color:#d9b9be;outline:none}
.top{display:flex;align-items:center;gap:16px}
.no{flex:none;width:40px;height:40px;border-radius:50%;background:var(--red);color:#fff;font-weight:700;font-size:20px;display:flex;align-items:center;justify-content:center}
.icon{flex:none;width:128px;margin-left:auto}
.icon svg{display:block;width:100%;height:auto}
.card h3{margin:14px 0 6px;font-size:21px;line-height:1.3;color:var(--maroon)}
.card h3 span{display:block;color:var(--red)}.card h3 span:first-child{color:var(--maroon)}
.card p{margin:0 0 12px;color:#5d5450;line-height:1.55;font-size:14.5px}
.tags{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:16px}
.tags span{font-size:12.5px;border:1px solid var(--line);background:#faf8f4;color:#6f6660;border-radius:3px;padding:2px 8px}
.bottom{margin-top:auto;display:flex;align-items:center;justify-content:space-between;gap:10px}
.ver{font-size:12px;color:var(--muted)}.ver b{color:var(--ink)}
.go{display:inline-flex;align-items:center;gap:8px;background:linear-gradient(110deg,var(--red),var(--red2));color:#fff;font-weight:700;font-size:15px;padding:10px 20px;border-radius:4px}
.go svg{width:16px;height:16px}
.foot{margin:18px 4px 6px;color:var(--muted);font-size:12.5px;line-height:1.6}
.kakao{display:flex;flex-wrap:wrap;align-items:center;gap:8px 10px;background:#fff7e0;border:1px solid #f0d27a;border-left:5px solid #f7c600;padding:10px 12px;margin-top:10px;font-size:13.5px;line-height:1.45}
.kakao[hidden]{display:none}.kakao .kt{flex:1 1 260px;order:1}.kakao .kt b{display:block;color:#5a4300}
.kakao .kx{order:2;border:none;background:none;font-size:22px;line-height:1;color:#8c827b;cursor:pointer;padding:0 4px}
#kkBtn{order:3;flex:1 1 100%;text-align:center;padding:10px;border:0;border-radius:4px;background:var(--red);color:#fff;font:700 14px var(--font);cursor:pointer}#kkBtn[hidden]{display:none!important}

.flag{display:block;width:26px;height:17px;border-radius:2px;box-shadow:0 0 0 1px rgba(0,0,0,.18)}
.flagbar{display:flex;align-items:center;gap:6px;margin-left:auto}
.flagbtn{border:0!important;background:transparent!important;padding:4px!important;border-radius:5px!important;cursor:pointer;opacity:.62;filter:saturate(.75);transition:opacity .15s,filter .15s,box-shadow .15s;line-height:0}
.flagbtn:hover{opacity:.85;filter:none}
.flagbtn.on,.flagbtn[aria-pressed="true"]{opacity:1;filter:none;box-shadow:0 0 0 2px #b5122b!important;background:#fff!important}
.homebtn{display:inline-flex;align-items:center;justify-content:center;width:36px;height:30px;margin-left:4px;border:1px solid #e7e0d5;border-radius:5px;background:#fff;color:#4a1d22;text-decoration:none}
.homebtn:hover{border-color:#b5122b;color:#b5122b}

@media (max-width:760px){.cards{grid-template-columns:1fr}.icon{width:104px}.card h3{font-size:19px}header{padding:12px 14px;gap:12px}header img{height:38px}header h1{font-size:19px}}
</style>
</head>

let lang='ko'; try{const l=localStorage.getItem('baos-lang'); if(T[l]) lang=l;}catch(e){}
const $=id=>document.getElementById(id);
function apply(){
  const d=T[lang]; document.documentElement.lang=lang; document.title=d.title;
  document.querySelectorAll('[data-i]').forEach(el=>{const v=d[el.dataset.i]; if(typeof v==='string') el.textContent=v;});
  $('t1').innerHTML=d.t1.map(x=>`<span>${x}</span>`).join(''); $('t2').innerHTML=d.t2.map(x=>`<span>${x}</span>`).join('');
  $('man').href='docs/manual_'+lang+'.pdf';
  $('kkHow').textContent=/iPhone|iPad|iPod/i.test(navigator.userAgent)?d.kkIos:d.kkAnd;
  document.querySelectorAll('#lang .flagbtn').forEach(b=>{b.classList.toggle('on',b.dataset.l===lang); b.setAttribute('aria-pressed',b.dataset.l===lang);});
}
document.querySelectorAll('#lang .flagbtn').forEach(b=>b.addEventListener('click',()=>{lang=b.dataset.l; try{localStorage.setItem('baos-lang',lang)}catch(e){} apply();}));
document.addEventListener('keydown',e=>{ if(e.key==='1') location.href='cut.html'; if(e.key==='2') location.href='ratio.html'; });
(function(){ const ua=navigator.userAgent; if(!/KAKAOTALK/i.test(ua)) return;
  try{ if(sessionStorage.getItem('kkClosed')) return; }catch(e){}
  $('kakao').hidden=false;
  if(/Android/i.test(ua)){ const b=$('kkBtn'); b.hidden=false; b.onclick=()=>{ location.href='kakaotalk://web/openExternal?url='+encodeURIComponent(location.href); }; }
  $('kkX').onclick=()=>{ $('kakao').hidden=true; try{sessionStorage.setItem('kkClosed','1')}catch(e){} };
})();
apply();
if('serviceWorker' in navigator && (location.protocol==='https:'||location.hostname==='localhost')){window.addEventListener('load',()=>navigator.serviceWorker.register('sw.js').catch(()=>{}));}

if(location.protocol==='http:'&&location.hostname==='127.0.0.1'){const hb=()=>fetch('/ping',{cache:'no-store'}).catch(()=>{});hb();setInterval(hb,3000);
  window.addEventListener('pagehide',()=>{try{navigator.sendBeacon('/bye')}catch(e){}});}

</script>
