<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#b5122b">
<meta name="description" content="제품크기 VS BAOS 공정 판정기 - 제품 크기로 해당 인치, 근접 비율, 적용 가능 기계를 판정합니다.">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" sizes="32x32" href="icons/favicon-32.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="BAOS 판정기">
<title>제품크기 VS BAOS 공정 판정기</title>
<style>
:root{
  --red:#b5122b; --red2:#dc1f3c; --orange:#e8892e; --beige:#bcb09c; --maroon:#4a1d22;
  --bg:#f4f1ec; --panel:#fff; --line:#e7e0d5; --line2:#f0ebe3; --ink:#2b2325; --muted:#8c827b;
  --blue:#dcecf8; --blueInk:#2d6aa3; --green:#1d8a4b; --greenBg:#e7f5ec; --prod:#f4efe5;
  --num:'Times New Roman','Malgun Gothic','맑은 고딕',serif;
  --sans:'Times New Roman','Malgun Gothic','맑은 고딕',serif;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--sans);font-size:14px}
.num{font-family:var(--num)}
.wrap{max-width:1680px;margin:0 auto;padding:10px}
.stripe{height:4px;display:flex;border-radius:2px 2px 0 0;overflow:hidden}
.stripe i{flex:1}
header{background:var(--panel);border:1px solid var(--line);border-top:none;display:flex;align-items:center;gap:18px;padding:14px 20px;margin-bottom:10px}
header img{height:46px;width:auto}
header h1{margin:0;font-size:21px;font-weight:700;letter-spacing:-.3px}
header .meta{color:var(--muted);font-size:12px;margin-top:3px}
header .meta b{color:var(--ink);font-family:var(--num);font-weight:600}
.lang{margin-left:auto;display:flex;border:1px solid var(--line);border-radius:3px;overflow:hidden}
.lang button{border:none;background:#fff;padding:7px 13px;font:600 13px var(--num);color:#555;cursor:pointer;border-left:1px solid var(--line)}
.lang button:first-child{border-left:none;font-family:var(--sans)}
.lang button.on{background:var(--red);color:#fff}
.grid{display:grid;grid-template-columns:350px 1fr;gap:10px;align-items:start}
.card{background:var(--panel);border:1px solid var(--line);padding:14px 14px 16px}
.card h2{margin:0 0 12px;font-size:14px;font-weight:700;color:var(--red);letter-spacing:.5px;display:flex;align-items:center}
.card h2 .r{margin-left:auto;font-size:12px;color:var(--muted);font-weight:400;letter-spacing:0}
.left{display:flex;flex-direction:column;gap:10px;position:sticky;top:10px}
.frow{display:grid;grid-template-columns:92px 1fr 1fr;gap:6px;align-items:center;margin-bottom:8px}
.frow .lbl{font-weight:700;font-size:13.5px;line-height:1.2}
.frow .lbl small{display:block;font-weight:400;color:var(--muted);font-size:11px}
.colh{display:grid;grid-template-columns:92px 1fr 1fr;gap:6px;margin-bottom:4px;color:var(--muted);font:12px var(--num);text-align:center}
input[type=number],select{width:100%;border:1px solid var(--line);background:#fff;padding:8px 9px;font:600 16px var(--num);text-align:right;color:var(--ink);border-radius:2px;outline:none}
select{text-align:left;font-size:14px;padding:7px}
input[type=number]:focus,select:focus{border-color:var(--red);box-shadow:0 0 0 2px rgba(181,18,43,.12)}
input.hl{background:#e6f1fb;border-color:#9fc6ea;color:var(--blueInk)}
.sec{margin-top:14px;font-weight:700;font-size:13.5px;margin-bottom:6px}
.sec small{font-weight:400;color:var(--muted);font-size:11px;margin-left:4px}
.seg{display:flex;border:1px solid var(--line);border-radius:2px;overflow:hidden}
.seg button{flex:1;border:none;border-left:1px solid var(--line);background:#fff;padding:8px 4px;font:500 13px var(--sans);color:#776d66;cursor:pointer}
.seg button:first-child{border-left:none}
.seg button.on{background:var(--red);color:#fff;font-weight:700}
.inch{display:grid;grid-template-columns:1fr 1fr 64px;gap:6px}
.btn{text-decoration:none;display:inline-block;border:1px solid var(--line);background:#fff;padding:8px 12px;font:600 13px var(--sans);cursor:pointer;border-radius:2px;color:var(--ink)}
.btn:hover{border-color:var(--red);color:var(--red)}
.btn.red{background:var(--red);color:#fff;border-color:var(--red)}
.btn.red:hover{background:var(--red2);color:#fff}
.hero{background:linear-gradient(110deg,var(--red) 0%,var(--red2) 100%);color:#fff;padding:12px 14px 14px;border-radius:2px;position:relative;overflow:hidden}
.hero .t{font-size:13px;opacity:.95}
.hero .v{font:700 40px/1.05 var(--num);margin-top:4px}
.hero .v span{font:600 17px var(--sans);margin-left:4px}
.hero .s{position:absolute;right:14px;bottom:14px;font:600 13px var(--num);text-align:right;line-height:1.5}
.hero.zero{background:linear-gradient(110deg,#6d6360,#8f8480)}
.basis{display:grid;grid-template-columns:1fr 1fr;gap:6px}
.bx{border:1px solid var(--line);padding:7px 9px;border-radius:2px}
.bx .k{font-size:11.5px;color:var(--muted)}
.bx .n{font:700 19px var(--num)}
.bx .n span{font:600 13px var(--sans)}
.bx.on{border-color:var(--red);background:#fff5f6}
.bx.on .k{color:var(--red);font-weight:700}
.foot{display:flex;gap:6px}
.right{display:flex;flex-direction:column;gap:10px;min-width:0}
.pill{margin-left:auto;font-size:12.5px;padding:3px 10px;border-radius:12px;background:var(--greenBg);color:var(--green);font-weight:600;letter-spacing:0}
.pill::before{content:"●";font-size:9px;margin-right:5px;vertical-align:1px}
.pill.no{background:#fbe9ec;color:var(--red)}
table.out{width:100%;border-collapse:collapse}
table.out th{font:600 12px var(--num);color:var(--muted);text-align:right;padding:4px 8px;border-bottom:1px solid var(--line)}
table.out td{padding:9px 8px;border-bottom:1px solid var(--line2);vertical-align:middle}
table.out td:first-child{font-weight:500;width:220px}
table.out td.red{color:var(--red);font-weight:700}
table.out td.v{text-align:right;font:700 17px var(--num)}
table.out td.v small{font:500 12px var(--sans);color:var(--muted);margin-left:3px}
.note{color:var(--muted);font-size:12.5px;margin-top:8px}
.ratios{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;margin-top:12px}
.rt{border:1px solid var(--line);border-radius:2px;padding:8px 6px 7px;text-align:center;position:relative}
.rt .shape{height:34px;display:flex;align-items:center;justify-content:center;margin-bottom:5px}
.rt .shape i{display:block;border:1.5px solid var(--beige);background:var(--prod)}
.rt .nm{font:700 15px var(--num)}
.rt .dv{font:500 11.5px var(--num);color:var(--muted)}
.rt.best{border-color:var(--red);background:#fff5f6}
.rt.best .shape i{border-color:var(--red);background:#fbdde2}
.rt.best .nm{color:var(--red)}
.rt.best::after{content:attr(data-tag);position:absolute;top:-8px;left:50%;transform:translateX(-50%);background:var(--red);color:#fff;font-size:10.5px;padding:1px 7px;border-radius:8px;white-space:nowrap}
.two{display:grid;grid-template-columns:1fr;gap:10px}
svg text{font-family:var(--num)}
.legend{display:flex;flex-wrap:wrap;gap:14px;font-size:12px;color:#6f6660;margin-top:6px}
.legend i{display:inline-block;width:14px;height:10px;margin-right:5px;vertical-align:-1px;border:1px solid}
.tbl{width:100%;border-collapse:collapse;font-size:13px}
.tbl th{background:#faf8f4;color:#6c625c;font-weight:600;font-size:12px;text-align:left;padding:8px;border-bottom:1px solid var(--line);white-space:nowrap;position:sticky;top:0}
.tbl td{padding:7px 8px;border-bottom:1px solid var(--line2);white-space:nowrap}
.tbl td.n{font-family:var(--num);text-align:right}
.tbl tr.grp td{border-top:1px solid var(--line)}
.tbl tr.x td{color:#a39a93}
.tbl tr.x td.mn{color:#8c827b}
.tbl tr:hover td,.tbl tr.hov td{background:#fdf7f0}
.ok,.ng{display:inline-flex;align-items:center;justify-content:center;width:24px;height:24px;border-radius:50%;font:700 13px var(--num)}
.ok{background:var(--greenBg);color:var(--green);border:1px solid #a8d8b9}
.ng{background:#f6f1ee;color:#b9aea7;border:1px solid var(--line)}
.mn{font-weight:700;color:var(--ink)}
.tag{display:inline-block;font:600 11px var(--sans);padding:1px 7px;border-radius:2px;border:1px solid var(--line);color:#6f6660}
.tag.roll{border-color:#b8d3ea;color:var(--blueInk);background:#f1f7fc}
.why{font-size:12px;color:var(--red)}
.why.okw{color:var(--green)}
.tblwrap{max-height:640px;overflow:auto;border:1px solid var(--line2)}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%) translateY(20px);background:var(--maroon);color:#fff;padding:9px 18px;border-radius:3px;font-size:13px;opacity:0;transition:.25s;pointer-events:none}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
.empty{padding:24px;text-align:center;color:var(--muted)}
@media print{body{background:#fff}.lang,.foot,.toast{display:none!important}.left{position:static}.tblwrap{max-height:none;overflow:visible}.card,.hero{break-inside:avoid}@page{size:A4 landscape;margin:8mm}}
@media (max-width:1100px){.two{grid-template-columns:1fr}.ratios{grid-template-columns:repeat(4,1fr);row-gap:14px}}
@media (max-width:600px){.wrap{padding:6px}header{padding:10px 12px;gap:10px}header img{height:36px}header h1{font-size:17px}.ratios{grid-template-columns:repeat(3,1fr)}.tblwrap{font-size:12px}.foot{flex-wrap:wrap}}
@media (max-width:900px){.grid{grid-template-columns:1fr}.left{position:static}header{flex-wrap:wrap}.lang{margin-left:0}}
</style>
</head>

/* ===== state ===== */
const S={lang:'ko',mtype:'all',site:'all',show:'all',hover:-1};
try{const l=localStorage.getItem('baos_ratio_lang'); if(T[l]) S.lang=l;}catch(e){}
const $=id=>document.getElementById(id);
const t=k=>T[S.lang][k];
const fmt=(v,d=0)=>Number(v).toLocaleString('en-US',{minimumFractionDigits:d,maximumFractionDigits:d});
const catName=c=>c==='ROLL'?'Rollstamping':c;
const gcd=(a,b)=>{a=Math.abs(a);b=Math.abs(b);while(b){[a,b]=[b,a%b]}return a};

function judge(m,L,W){
  const r=[];
  const strict = m.type==='ROLL';
  if(L>m.maxL) r.push('gtMaxL');
  if(strict && L<m.minL) r.push('ltMinL');
  if(W<m.minW) r.push('ltMinW');
  if(strict && W>m.maxW) r.push('gtMaxW');
  return r;
}
function siteOf(m){
  if(/SPEC/i.test(m.name)) return 'SPEC';
  if(m.name.includes('어연')) return '어연';
  if(m.name.includes('VINA')) return 'VINA';
  if(/K창고|\(K /.test(m.name)) return 'K';
  return 'etc';
}
function calc(){
  const L=parseFloat($('L').value), W=parseFloat($('W').value);
  if(!(L>0&&W>0)) return null;
  const D=Math.hypot(L,W), inch=D/25.4;
  const a=Math.round(L*10), b=Math.round(W*10), g=gcd(a,b);
  const ra=a/g, rb=b/g;
  const big=Math.max(L,W), small=Math.min(L,W), r=big/small;
  const ratios=RATIOS.map(([p,q])=>({p,q,v:p/q,dev:(r/(p/q)-1)*100}));
  let best=ratios[0]; ratios.forEach(x=>{ if(Math.abs(Math.log(r/x.v))<Math.abs(Math.log(r/best.v))) best=x; });
  const nearIn=Math.round(inch);
  const orient = Math.abs(L-W)<0.05?'square':(L>W?'landscape':'portrait');
  const res=M.map(m=>({m,why:judge(m,L,W)}));
  return {L,W,D,inch,ra,rb,r,ratios,best,nearIn,orient,res};
}

/* ===== render ===== */
function applyLang(){
  document.documentElement.lang=S.lang;
  const ml=$('manual'); if(ml) ml.href='docs/manual_'+S.lang+'.pdf';
  document.querySelectorAll('[data-i]').forEach(el=>{const v=t(el.dataset.i); if(typeof v==='string') el.textContent=v;});
  document.querySelectorAll('#lang button').forEach(b=>b.classList.toggle('on',b.dataset.l===S.lang));
  document.title=t('title');
}
function segs(){
  ['mtype','site'].forEach(k=>document.querySelectorAll('#'+k+' button').forEach(b=>b.classList.toggle('on',b.dataset.v===S[k])));
}
function render(){
  segs();
  const c=calc();
  if(!c){ // 입력칸이 비어 있을 때: 이전 결과를 지우고 안내만 표시
    $('heroN').textContent='–'; $('heroS').innerHTML=''; $('hero').classList.add('zero');
    $('pill').textContent=t('inv'); $('pill').className='pill no';
    $('oDiag').innerHTML='–'; $('oNear').innerHTML='–'; $('note').textContent='';
    $('ratios').innerHTML=RATIOS.map(([p,q])=>{const v=p/q, sw=46*Math.min(1,34*v/46), sh=sw/v;
      return `<div class="rt"><div class="shape"><i style="width:${sw}px;height:${sh}px"></i></div><div class="nm">${p}:${q}</div><div class="dv">–</div></div>`;}).join('');
    $('basis').innerHTML=''; $('shapeR').textContent='';
    $('shape').innerHTML=`<text x="320" y="215" text-anchor="middle" font-size="22" fill="#8c827b">${t('inv')}</text>`;
    $('tbody').innerHTML=`<tr><td colspan="8" class="empty">${t('inv')}</td></tr>`; $('listR').textContent='';
    return; }

  // ratio outputs
  const intOk = c.ra<=99 && c.rb<=99;
  const bd=c.best.dev, bstd = c.orient==='portrait'?`${c.best.q}:${c.best.p}`:`${c.best.p}:${c.best.q}`;
  $('oDiag').innerHTML = `${fmt(c.D,1)}<small>mm</small>`;
  $('oNear').innerHTML = `${c.nearIn}" <small>(${c.inch.toFixed(2)}")</small>`;
  $('ratios').innerHTML = c.ratios.map(x=>{
    const w=x.v>=1? 46 : 46*x.v, h=Math.min(34,46/x.v);
    const sw = 46*Math.min(1,34*x.v/46), sh = sw/x.v;
    const isB=x===c.best;
    return `<div class="rt${isB?' best':''}" data-tag="${t('best')}"><div class="shape"><i style="width:${sw}px;height:${sh}px"></i></div>
      <div class="nm">${x.p}:${x.q}</div><div class="dv">${Math.abs(x.dev)<0.5?'≈ 0%':(x.dev>0?'+':'')+x.dev.toFixed(1)+'%'}</div></div>`;
  }).join('');
  $('note').textContent = T[S.lang].noteR(t(c.orient), bstd, Math.abs(bd).toFixed(1)+'%');

  // machines
  const vis=c.res.filter(x=>(S.mtype==='all'||x.m.type===S.mtype)&&(S.site==='all'||siteOf(x.m)===S.site));
  const okv=vis.filter(x=>!x.why.length);
  $('heroN').textContent=okv.length;
  $('hero').classList.toggle('zero',okv.length===0);
  const pc=okv.filter(x=>x.m.type==='PRESS').length, rc=okv.filter(x=>x.m.type==='ROLL').length;
  $('heroS').innerHTML=`${t('cPress')} ${pc}<br>Rollstamping ${rc}`;
  $('pill').textContent= okv.length? t('ok'):t('no'); $('pill').className='pill'+(okv.length?'':' no');

  // by cat
  const cats=[...new Set(M.map(m=>m.cat))];
  $('basis').innerHTML=cats.map(cat=>{
    const all=vis.filter(x=>x.m.cat===cat); if(!all.length) return '';
    const n=all.filter(x=>!x.why.length).length;
    return `<div class="bx${n?' on':''}"><div class="k">${catName(cat)}${n?' · '+t('ok'):''}</div><div class="n">${n} <span>/ ${all.length}</span></div></div>`;
  }).join('');

  // table
  const rows=okv;
  let prev='';
  $('tbody').innerHTML = rows.length? rows.map(x=>{
    const m=x.m, ok=!x.why.length, g=m.model!==prev; prev=m.model;
    const why= ok?`<span class="why okw">${t('whyOk')}</span>`:`<span class="why">${x.why.map(k=>t(k)+' ('+fmt(m[{gtMaxL:'maxL',ltMinL:'minL',gtMaxW:'maxW',ltMinW:'minW'}[k]])+')').join(' · ')}</span>`;
    return `<tr class="${ok?'':'x'}${g?' grp':''}" data-id="${m.id}">
      <td><span class="${ok?'ok':'ng'}">${ok?'O':'X'}</span></td>
      <td class="mn">${m.name}</td><td>${m.model}</td>
      <td><span class="tag${m.type==='ROLL'?' roll':''}">${catName(m.cat)}</span></td>
      <td class="num" style="color:#8c827b">${m.sn||'—'}</td>
      <td class="n">${fmt(m.minL)} × ${fmt(m.minW)}</td><td class="n">${fmt(m.maxL)} × ${fmt(m.maxW)}</td>
      <td>${why}</td></tr>`;
  }).join('') : `<tr><td colspan="8" class="empty">${t('none')}</td></tr>`;
  $('listR').textContent=T[S.lang].shown(rows.length, vis.length);
  $('ruleNote').textContent = t('ruleExcelNote');

  drawShape(c);
}

function drawShape(c){
  const svg=$('shape'), VW=640, VH=430, pad={l:70,r:60,t:60,b:60};
  const aw=VW-pad.l-pad.r, ah=VH-pad.t-pad.b;
  // standard overlay: same L, height by best ratio
  const sv = c.orient==='portrait'? c.best.q/c.best.p : c.best.p/c.best.q;
  const stdW = c.L/sv;
  const maxW=Math.max(c.W,stdW);
  const s=Math.min(aw/c.L, ah/maxW);
  const w=c.L*s, h=c.W*s, x0=pad.l+(aw-w)/2, y0=pad.t+(ah-Math.max(h,stdW*s))/2 + (Math.max(h,stdW*s)-h);
  const sh=stdW*s, sy=y0+h-sh;
  const red='#b5122b', or='#e8892e';
  const tick=(x,y)=>`<line x1="${x-6}" y1="${y+6}" x2="${x+6}" y2="${y-6}" stroke="${or}" stroke-width="1.3"/>`;
  const ang=Math.atan2(h,w)*180/Math.PI;
  const cx=x0+w/2, cy=y0+h/2;
  svg.innerHTML=`
   <defs><pattern id="hatch" width="14" height="14" patternUnits="userSpaceOnUse" patternTransform="rotate(-50)"><line x1="0" y1="0" x2="0" y2="14" stroke="#e4dccd" stroke-width="1"/></pattern></defs>
   <rect x="${x0}" y="${y0}" width="${w}" height="${h}" fill="#f4efe5"/>
   <rect x="${x0}" y="${y0}" width="${w}" height="${h}" fill="url(#hatch)" stroke="#4a1d22" stroke-width="2"/>
   <rect x="${x0}" y="${sy}" width="${w}" height="${sh}" fill="none" stroke="#2d6aa3" stroke-width="1.4" stroke-dasharray="6 4"/>
   <text x="${x0+w-6}" y="${sy-8}" text-anchor="end" font-size="17" fill="#2d6aa3">${c.orient==='portrait'?c.best.q+':'+c.best.p:c.best.p+':'+c.best.q} · ${fmt(c.L)} × ${fmt(stdW)}</text>
   <line x1="${x0}" y1="${y0+h}" x2="${x0+w}" y2="${y0}" stroke="${red}" stroke-width="2"/>
   <g transform="translate(${cx},${cy}) rotate(${-ang})">
     <rect x="-112" y="-42" width="224" height="32" fill="#fff" opacity=".9" rx="2"/>
     <text x="0" y="-19" text-anchor="middle" font-size="20" font-weight="700" fill="${red}">${fmt(c.D,1)} mm · ${Math.round(c.inch)}"</text>
   </g>
   <line x1="${x0}" y1="${y0+h+30}" x2="${x0+w}" y2="${y0+h+30}" stroke="${or}" stroke-width="1.2"/>${tick(x0,y0+h+30)}${tick(x0+w,y0+h+30)}
   <text x="${cx}" y="${y0+h+58}" text-anchor="middle" font-size="22" fill="${red}">L ${fmt(c.L,c.L%1?1:0)}</text>
   <line x1="${x0-30}" y1="${y0}" x2="${x0-30}" y2="${y0+h}" stroke="${or}" stroke-width="1.2"/>${tick(x0-30,y0)}${tick(x0-30,y0+h)}
   <text transform="translate(${x0-48},${cy}) rotate(-90)" text-anchor="middle" font-size="22" fill="${red}">W ${fmt(c.W,c.W%1?1:0)}</text>
   <text x="${x0+14}" y="${y0+40}" text-anchor="start" font-size="29" font-weight="700" fill="#2b2325" style="font-family:var(--sans)">${c.ra<=99&&c.rb<=99?c.ra+' : '+c.rb:'≈ '+(c.L/c.W).toFixed(2)+' : 1'}</text>`;
  $('shapeR').textContent=`${fmt(c.L,1)} × ${fmt(c.W,1)} mm`;
}

/* ===== events ===== */
['L','W'].forEach(id=>$(id).addEventListener('input',render));
document.querySelectorAll('#lang button').forEach(b=>b.onclick=()=>{S.lang=b.dataset.l;try{localStorage.setItem('baos_ratio_lang',S.lang)}catch(e){};applyLang();render();});
['mtype','site'].forEach(k=>document.querySelectorAll('#'+k+' button').forEach(b=>b.onclick=()=>{S[k]=b.dataset.v;render();}));
$('reset').onclick=()=>{ $('L').value='';$('W').value='';Object.assign(S,{mtype:'all',site:'all'});render(); $('L').focus(); };
// 입력칸을 클릭하면 기존 값이 전체 선택되어 바로 새 숫자를 입력할 수 있습니다. Enter = 다음 칸
['L','W'].forEach(id=>{const el=$(id);
  el.addEventListener('focus',()=>{try{el.select()}catch(e){} el._f=true;});
  el.addEventListener('mouseup',e=>{if(el._f){e.preventDefault(); el._f=false;}});
  el.addEventListener('blur',()=>{el._f=false;});});
$('L').addEventListener('keydown',e=>{if(e.key==='Enter'){e.preventDefault();$('W').focus();}});
$('W').addEventListener('keydown',e=>{if(e.key==='Enter'){e.preventDefault();$('W').blur();}});

function toast(msg){const el=$('toast');el.textContent=msg;el.classList.add('show');clearTimeout(toast._t);toast._t=setTimeout(()=>el.classList.remove('show'),1800);}
$('copy').onclick=async()=>{
  const c=calc(); if(!c) return;
  const vis=c.res.filter(x=>(S.mtype==='all'||x.m.type===S.mtype)&&(S.site==='all'||siteOf(x.m)===S.site));
  const ok=vis.filter(x=>!x.why.length).map(x=>`- ${x.m.name}${x.m.sn?' (#'+x.m.sn+')':''} [${x.m.cat}]`);
  const txt=[`[BAOS] ${t('title')}`,`${t('size')}: ${c.L} × ${c.W} mm`,`${t('best')}: ${c.best.p}:${c.best.q} (${c.best.dev>0?'+':''}${c.best.dev.toFixed(1)}%)`,
    `${t('oDiag')}: ${c.D.toFixed(1)} mm · ${t('oNear')}: ${c.nearIn}" (${c.inch.toFixed(2)}")`,`${t('heroT')}: ${ok.length}`,...ok].join('\n');
  try{ await navigator.clipboard.writeText(txt); toast(t('copied')); }
  catch(e){ const ta=$('cpy'); ta.value=txt; ta.select(); try{ document.execCommand('copy')?toast(t('copied')):toast(t('copyFail')); }catch(_){toast(t('copyFail'));} }
};

$('print').onclick=()=>window.print();
if('serviceWorker' in navigator && (location.protocol==='https:'||location.hostname==='localhost')){window.addEventListener('load',()=>navigator.serviceWorker.register('sw.js').catch(()=>{}));}
$('L').value=DEF.L; $('W').value=DEF.W; applyLang(); render();
</script>
