<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#b5122b">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" sizes="32x32" href="icons/favicon-32.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="BAOS CHECKER">
<title>BAOS 판재 절단 계산기 · BAOS CHECKER</title>
<meta name="claude:viewport-fit-sides" content="cover">
<style>
/* Layout: 소형 한 화면 — 상단 CI 헤더(언어 탭) · 좌측 입력 · 우측 결과 + 배치도 */
/* BAOS CI: ① 레드(M100Y85→C15M100Y90K20) ② 오렌지(M60Y100→M70Y95) ③ 웜그레이(C25M25Y40K30→C22M25Y40K10) ④ 버건디(M60Y20K90) */
:root{
  --ci1a:#E61E3C; --ci1b:#B5172B; --ci2a:#F5921E; --ci2b:#F07B27; --ci3a:#8E8571; --ci3b:#B3A68E; --ci4:#44111A;
  --brand:#B5172B; --brand-ink:#ffffff; --accent:#F07B27;
  --bg:#FBF9F6; --panel:#FFFFFF; --fg:#3A2A2C; --muted:#857B6E; --line:#E9E2D7; --field:#FDFCFA; --ph:#C9BEAD;
  --sheet:#FFFFFF; --border-area:#EFE9DF; --cell:#F6F1E8; --hatch:#DDD1BD; --prod:#44111A; --dim:#E61E3C; --cut:#F07B27;
  --kerf:#E61E3C; --remain:#DDF0FB; --remain-line:#8CC4E6; --remain-ink:#2F78A8; --warn:#B45A00; --warn-bg:#FDF0DF;
  --ok:#1E8A50; --ok-bg:#E6F5EC; --bad:#D0193A; --bad-bg:#FCE6E9;
  /* 영문·숫자: Times New Roman / 한글: 맑은 고딕 */
  --font:"Times New Roman",Times,"Malgun Gothic","맑은 고딕","Apple SD Gothic Neo","Noto Sans KR",serif;
  color-scheme:light;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--fg);font-family:var(--font);font-size:12.6px;line-height:1.35}
.wrap{height:100%;margin:0 auto;padding-block:6px;padding-left:max(8px,env(safe-area-inset-left,0px));padding-right:max(8px,env(safe-area-inset-right,0px));display:flex;flex-direction:column;gap:6px}
header{position:relative;display:flex;align-items:center;gap:12px;background:var(--panel);border:1px solid var(--line);border-radius:5px;padding:14px 12px 10px;overflow:hidden;flex:none;flex-wrap:wrap}
header::before{content:"";position:absolute;inset:0 0 auto 0;height:3px;background:linear-gradient(90deg,var(--ci1a) 0 25%,var(--ci2a) 25% 50%,var(--ci3b) 50% 75%,var(--ci4) 75% 100%)}
.logo img{height:36px;width:auto;display:block}
.ttl{min-width:0}
header h1{margin:0;font-size:16.6px;font-weight:700;color:var(--ci4);white-space:nowrap}
.meta{font-size:10.5px;color:var(--muted);white-space:nowrap}
.meta b{color:var(--fg);font-weight:600}
.lang{margin-left:auto;display:flex;border:1px solid var(--line);border-radius:4px;overflow:hidden}
.lang button{border:0;border-right:1px solid var(--line);border-radius:0;padding:3px 9px;font:700 11.5px var(--font);background:var(--field);color:var(--muted);cursor:pointer}
.lang button:last-child{border-right:0}
.lang button[aria-pressed="true"]{background:var(--brand);color:var(--brand-ink)}
.main{flex:1;min-height:0;display:grid;grid-template-columns:282px minmax(0,1fr);gap:6px}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:5px;padding:7px 9px;min-width:0}
.panel h2{margin:0 0 4px;font-size:11.5px;font-weight:700;letter-spacing:.04em;color:var(--brand)}
form.panel{overflow:auto;display:flex;flex-direction:column;gap:9px}
.grid{display:grid;grid-template-columns:78px minmax(0,1fr) minmax(0,1fr);gap:3px 4px;align-items:center}
.grid .hd{font-size:10.5px;color:var(--muted);text-align:center}
.grid .lb{font-size:11.5px;font-weight:700;line-height:1.15}
.grid .span2{grid-column:2/4}
.grid .lb .sub{font-size:9.6px;font-weight:400;color:var(--muted)}
.row4{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:3px}
.f{display:flex;flex-direction:column;gap:0;font-size:10.5px;color:var(--muted);min-width:0;text-align:center}
.blk .lb{font-size:11.5px;font-weight:700;margin-bottom:1px}
input.n,output.n{width:100%;font:600 13.7px var(--font);font-variant-numeric:tabular-nums;color:var(--fg);background:var(--field);border:1px solid var(--line);border-radius:3px;padding:2px 6px;height:25px;text-align:right}
input.n::placeholder{color:var(--ph);font-weight:400}
input.n:focus{outline:2px solid var(--accent);outline-offset:0;border-color:var(--accent);background:#fff}
.seg{display:flex;border:1px solid var(--line);border-radius:3px;overflow:hidden}
.seg label{flex:1;text-align:center;font-size:11.5px;padding:3px 2px;cursor:pointer;border-right:1px solid var(--line);color:var(--muted);background:var(--field);white-space:nowrap}
.seg label:last-child{border-right:0}
.seg input{position:absolute;opacity:0;pointer-events:none}
.seg label:has(input:checked){background:var(--brand);color:var(--brand-ink);font-weight:700}
.seg label:has(input:focus-visible){outline:2px solid var(--accent);outline-offset:-2px}
.cmp{display:grid;grid-template-columns:1fr 1fr;gap:4px}
.cmp:empty{display:none}
.cmp .ch{grid-column:1/-1;font-size:10.5px;color:var(--muted)}
.cc{display:flex;flex-direction:column;align-items:flex-start;text-align:left;padding:3px 6px;border:1px solid var(--line);background:var(--field);border-radius:3px;cursor:pointer;font-family:var(--font);color:var(--fg)}
.cc .cl{font-size:10.5px;color:var(--muted);font-weight:700}
.cc .cn{font-size:15.8px;font-weight:700;line-height:1.2}
.cc .cd{font-size:10.5px;color:var(--muted)}
.cc.sel{border-color:var(--brand);background:#FFF5F6;box-shadow:inset 3px 0 0 var(--brand)}
.cc.sel .cl{color:var(--brand)}
.cc.no .cn,.cc.no .cd{color:var(--bad)}
.btns{display:flex;gap:4px;margin-top:auto;padding-top:2px}
.btn{font:700 11.5px var(--font);border-radius:3px;padding:3px 10px;cursor:pointer;border:1px solid var(--line);background:var(--panel);color:var(--fg)}
.btn:hover,.cc:hover{border-color:var(--accent)}
button:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
.right{display:flex;flex-direction:column;gap:6px;min-width:0;min-height:0}
.summary{flex:none}
.count{background:linear-gradient(90deg,var(--ci1a),var(--ci1b));color:var(--brand-ink);border-radius:4px;padding:6px 10px;display:grid;grid-template-columns:1fr auto;grid-template-areas:"k k" "v d";align-items:end;gap:0 8px}
.count .k{grid-area:k} .count .v{grid-area:v} .count .d{grid-area:d;padding-bottom:3px}
.count .k{font-size:11px;opacity:.92;line-height:1.2}
.count .v{font-size:29.8px;font-weight:700;line-height:1;font-variant-numeric:tabular-nums}
.count .v small{font-size:13.7px;margin-left:3px}
.count .d{font-size:12.1px;font-weight:700}
.reshead{display:flex;align-items:center;justify-content:space-between;gap:6px;margin-bottom:2px}
.status{display:inline-flex;align-items:center;gap:4px;font-weight:700;font-size:11px;padding:1px 8px;border-radius:999px;white-space:nowrap}
.status.ok{color:var(--ok);background:var(--ok-bg)} .status.bad{color:var(--bad);background:var(--bad-bg)} .status.idle{color:var(--muted);background:var(--border-area)} .status.warn{color:var(--warn);background:var(--warn-bg)}
.status::before{content:"";width:6px;height:6px;border-radius:50%;background:currentColor}
table.res{width:100%;border-collapse:collapse;font-variant-numeric:tabular-nums}
table.res th,table.res td{padding:2px 6px;border-bottom:1px solid var(--line);text-align:right;white-space:nowrap}
table.res th:first-child,table.res td:first-child{text-align:left;white-space:normal}
table.res thead th{font-size:10.5px;color:var(--muted);font-weight:600}
table.res td{font-size:13.7px;font-weight:700}
table.res td:first-child{font-size:11.5px;font-weight:400}
table.res tr.key td{color:var(--brand);font-size:15.8px}
table.res tr.key td:first-child{font-size:11.5px;font-weight:700}
table.res td small{font-size:10px;color:var(--muted);font-weight:400}
.neg{color:var(--bad)!important}
output.n{display:flex;align-items:center;justify-content:flex-end}
output.calc{background:var(--remain);border-color:var(--remain-line);color:var(--remain-ink)}
.alert{display:flex;flex-direction:column;gap:1px;margin-top:5px;padding:5px 8px;border-radius:4px;background:var(--bad-bg);color:var(--bad);border-left:3px solid var(--bad);font-size:11px;line-height:1.3}
.alert b{font-size:12.5px}
.alert span{color:var(--fg)}
.note{font-size:11px;color:var(--muted);margin:3px 0 0;line-height:1.3}
.drawpanel{flex:1;min-height:0;display:flex;flex-direction:column}
.draw{flex:1;min-height:0;position:relative}
.draw svg{position:absolute;inset:0;width:100%;height:100%;display:block}
.draw .empty{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;text-align:center;color:var(--muted);font-size:12.1px;border:1px dashed var(--line);border-radius:4px;padding:10px}
.legend{display:flex;gap:10px;flex-wrap:wrap;font-size:10.5px;color:var(--muted);margin-top:2px}
.legend i{display:inline-block;width:12px;height:8px;vertical-align:-1px;margin-right:3px;border:1px solid var(--muted)}
.dsub{font-size:11px;color:var(--muted)}
/* 휴대폰 (세로 화면): 입력 → 생산 수 → 결과 → 배치도 순서로 아래로 스크롤 */
@media (max-width:640px){
  html,body,.wrap{height:auto}
  body{font-size:14px;-webkit-text-size-adjust:100%}
  .wrap{gap:10px;padding-block:calc(env(safe-area-inset-top,0px) + 8px) calc(env(safe-area-inset-bottom,0px) + 16px);padding-left:max(12px,env(safe-area-inset-left,0px));padding-right:max(12px,env(safe-area-inset-right,0px))}
  header{padding:12px 12px 10px;gap:8px 10px}
  .logo img{height:28px}
  header h1{font-size:18px}
  .meta{font-size:11px;white-space:normal}
  .lang{margin-left:0;width:100%}
  .lang button{flex:1;padding:8px 4px;font-size:13px}
  .main{grid-template-columns:minmax(0,1fr);gap:10px}
  .panel{padding:12px}
  .panel h2{font-size:13px}
  form.panel{overflow:visible;gap:12px}
  .grid{grid-template-columns:96px minmax(0,1fr) minmax(0,1fr);gap:6px}
  .grid .lb,.blk .lb{font-size:14px}
  .grid .hd,.f{font-size:12px}
  .row4{gap:6px}
  input.n,output.n{font-size:16px;height:40px;padding:4px 8px}
  .seg label{font-size:14px;padding:9px 2px}
  .count{padding:10px 14px}
  .count .k{font-size:13px} .count .v{font-size:40px} .count .d{font-size:15px}
  .cmp .ch{font-size:12px}
  .cc{padding:8px 10px} .cc .cl{font-size:12px} .cc .cn{font-size:18px} .cc .cd{font-size:12px}
  .btns{margin-top:0} .btn{font-size:14px;padding:9px 16px}
  #btnPrint{display:none}
  .summary .panel{padding:12px}
  table.res th,table.res td{padding:6px 4px}
  table.res td{font-size:15px} table.res td:first-child{font-size:13px}
  table.res tr.key td{font-size:17px} table.res tr.key td:first-child{font-size:13px}
  table.res td small{font-size:11px}
  output.n{display:flex;align-items:center;justify-content:flex-end}
output.calc{background:var(--remain);border-color:var(--remain-line);color:var(--remain-ink)}
.alert{display:flex;flex-direction:column;gap:1px;margin-top:5px;padding:5px 8px;border-radius:4px;background:var(--bad-bg);color:var(--bad);border-left:3px solid var(--bad);font-size:11px;line-height:1.3}
.alert b{font-size:12.5px}
.alert span{color:var(--fg)}
.note{font-size:12.5px}
  .reshead{flex-wrap:wrap}
  .dsub{font-size:12px}
  .draw{flex:none;aspect-ratio:1/1;max-width:100%}
  .legend{font-size:12px}
}

.flag{display:block;width:26px;height:17px;border-radius:2px;box-shadow:0 0 0 1px rgba(0,0,0,.18)}
.flagbar{display:flex;align-items:center;gap:6px;margin-left:auto}
.flagbtn{border:0!important;background:transparent!important;padding:4px!important;border-radius:5px!important;cursor:pointer;opacity:.62;filter:saturate(.75);transition:opacity .15s,filter .15s,box-shadow .15s;line-height:0}
.flagbtn:hover{opacity:.85;filter:none}
.flagbtn.on,.flagbtn[aria-pressed="true"]{opacity:1;filter:none;box-shadow:0 0 0 2px #b5122b!important;background:#fff!important}
.homebtn{display:inline-flex;align-items:center;justify-content:center;width:36px;height:30px;margin-left:4px;border:1px solid #e7e0d5;border-radius:5px;background:#fff;color:#4a1d22;text-decoration:none}
.homebtn:hover{border-color:#b5122b;color:#b5122b}

@media (max-width:640px){.flagbar{margin-left:auto}}
@media print{html,body,.wrap{height:auto} .no-print{display:none!important} .draw{flex:none;height:380px}}
@media (prefers-reduced-motion:no-preference){.btn,.seg label,.cc{transition:background .15s,border-color .15s}}
</style>

let lang = "ko";
try { const l = (localStorage.getItem("baos-lang")||localStorage.getItem("baos-cut-lang")); if (I18N[l]) lang = l; } catch(e){}
const t = (k, p={}) => (I18N[lang][k] ?? I18N.ko[k]).replace(/\{(\w+)\}/g, (_, n) => p[n]);

const $ = id => document.getElementById(id);
const IDS = ["rawX","rawY","prdX","prdY","mX","mY","cut","bT","bB","bL","bR"];

$("mVer").textContent = APP_VERSION; $("mDate").textContent = APP_DATE; $("mAuthor").textContent = APP_AUTHOR;

// 숫자 (천단위 구분기호)
const parse = s => { const v = parseFloat(String(s).replace(/,/g, "").trim()); return isFinite(v) ? v : NaN; };
const num = id => { const v = parse($(id).value); return isFinite(v) ? v : 0; };
const r6 = v => Math.round(v*1e6)/1e6;
const fmt = v => isFinite(v) ? (Math.round(v*100)/100).toLocaleString("en-US", {maximumFractionDigits:2}) : "-";
const mm = v => fmt(v) + " mm";

// 한 방향: 사용폭 = 원자재 - 테두리2개, 개수 = INT((사용폭+절단폭)/(재단크기+절단폭)), 최소 1
function axis(raw, pc, cut, b1, b2){
  const avail = raw - b1 - b2;
  let n = (pc + cut) > 0 ? Math.floor(r6((avail + cut)/(pc + cut))) : 0;
  if (n < 1) n = 1;
  const rem = r6(avail - n*pc - (n-1)*cut);   // 마지막 재단품 뒤 남는 길이 (음수 = 부족)
  const net = rem > 0 ? r6(rem - Math.min(cut, rem)) : 0;   // 잔량 분리 절단 후 실제 남는 판재
  return {n, rem, net, avail};
}
// px,py = 완제품 / qx,qy = 재단할 크기 (배치 방향 기준)
function layout(px, py, qx, qy, p){
  const ax = axis(p.rawX, qx, p.cut, p.bL, p.bR);
  const ay = axis(p.rawY, qy, p.cut, p.bT, p.bB);
  return {px, py, qx, qy, ax, ay, count: ax.n*ay.n, fit: ax.rem >= 0 && ay.rem >= 0, minR: Math.min(ax.rem, ay.rem)};
}
function short(L){
  const a = []; if (L.ax.rem < 0) a.push(`X ${mm(-L.ax.rem)}`); if (L.ay.rem < 0) a.push(`Y ${mm(-L.ay.rem)}`);
  return a.join(", ");
}
function read(){
  const p = {}; IDS.forEach(k => p[k] = num(k));
  p.ori = document.querySelector("input[name=ori]:checked").value;
  p.qX = p.prdX + p.mX; p.qY = p.prdY + p.mY;
  return p;
}
function calc(p){
  const N = layout(p.prdX, p.prdY, p.qX, p.qY, p), R = layout(p.prdY, p.prdX, p.qY, p.qX, p);
  let L, rot;
  if (p.ori === "n") { L = N; rot = false; }
  else if (p.ori === "r") { L = R; rot = true; }
  else {
    // 자동: 원자재 안에 들어가는 배치 우선 → 수량 많은 쪽 → 잔량 넉넉한 쪽 → 정방향
    const better = (R.fit && !N.fit) || (R.fit === N.fit && (R.count > N.count || (R.count === N.count && R.minR > N.minR + 1e-9)));
    L = better ? R : N; rot = better;
  }
  return {L, rot, N, R};
}
function borderSides(p){ return [p.bT, p.bB, p.bL, p.bR].filter(v => v >= BORDER_MIN - 1e-9).length; }

function clearOut(){
  $("oCount").innerHTML = `-<small>${t("pcs")}</small>`; $("oGrid").textContent = "X - × Y -";
  ["oNx","oNy","oTot"].forEach(id => { $(id).textContent = "-"; });
  $("oStatus").className = "status idle"; $("oStatus").textContent = t("stIdle");
  $("oNote").textContent = t("noteIdle"); $("oOri").textContent = ""; $("oWarn").hidden = true;
  $("cmp").innerHTML = ""; $("cmp").dataset.h = "";
  $("draw").innerHTML = `<div class="empty">${t("empty")}</div>`;
}

function render(){
  const p = read();
  const showPc = (v, base) => base > 0 ? mm(v) : "-";
  $("pcX").textContent = showPc(p.qX, p.prdX); $("pcY").textContent = showPc(p.qY, p.prdY);
  if (!(p.rawX>0 && p.rawY>0 && p.prdX>0 && p.prdY>0)) { clearOut(); return; }
  const {L, rot, N, R} = calc(p), {ax, ay} = L;

  $("oCount").innerHTML = `${fmt(L.count)}<small>${t("pcs")}</small>`;
  $("oGrid").textContent = `X ${fmt(ax.n)} × Y ${fmt(ay.n)}`;
  $("oNx").textContent = fmt(ax.n); $("oNy").textContent = fmt(ay.n);
  $("oTot").textContent = `${fmt(L.count)} ${t("pcs")}`;

  // 테두리 마진 경고
  const sides = borderSides(p), warn = sides < MIN_SIDES;
  $("oWarn").hidden = !warn;
  if (warn) $("oWarn").innerHTML = `<b>⚠ ${t("warnBorder")}</b><span>${t("warnBorderSub", {n: sides, req: MIN_SIDES, min: BORDER_MIN})}</span>`;

  const st = $("oStatus");
  if (!L.fit){ st.className = "status bad"; st.textContent = t("stBad"); $("oNote").textContent = t("noteBad", {s: short(L)}); }
  else {
    st.className = warn ? "status warn" : "status ok"; st.textContent = warn ? t("stWarn") : t("stOk");
    $("oNote").textContent = t("noteOk", {x: mm(ax.net), y: mm(ay.net)});
  }
  $("oOri").textContent = `${rot ? t("oriR") : t("oriN")} · ${t("sheet")} ${fmt(p.rawX)} × ${fmt(p.rawY)} mm`;

  const card = (key, lay, label) => {
    const sel = (key === "r") === rot;
    const detail = lay.fit ? `${t("remain")} X ${fmt(lay.ax.net)} · Y ${fmt(lay.ay.net)} mm` : t("short", {s: short(lay)});
    return `<button type="button" class="cc${sel ? " sel" : ""}${lay.fit ? "" : " no"}" data-ori="${key}">
      <span class="cl">${label}${sel ? " · " + t("applied") : ""}</span><span class="cn">${lay.fit ? fmt(lay.count) + " " + t("pcs") : t("na")}</span><span class="cd">${detail}</span></button>`;
  };
  const h = `<div class="ch">${p.ori === "auto" ? t("cmpAuto") : t("cmpMan")}</div>` + card("n", N, t("normal")) + card("r", R, t("rot"));
  if ($("cmp").dataset.h !== h){ $("cmp").innerHTML = h; $("cmp").dataset.h = h; }

  draw(p, L);
}

// 분할 형태: 원자재 좌측 하단을 기준으로 배치
function draw(p, L){
  const W = p.rawX, H = p.rawY, {ax, ay} = L, cut = p.cut;
  const qw = L.qx, qh = L.qy;
  const M = Math.max(W, H), box = $("draw").getBoundingClientRect();
  // 도면 글자를 화면 기준 약 12px로 유지
  const upp = (box.width > 0 && box.height > 0) ? Math.max(W/(box.width*0.82), H/(box.height*0.78)) : M/400;
  const fs = 12.5 * upp, pad = fs * 3.4;
  const vx = -pad, vy = -pad, vw = W + pad*1.8, vh = H + pad*1.9;
  const hs = M/60, total = ax.n * ay.n, maxCells = 3000;
  const x0 = p.bL, yB = H - p.bB;                 // 배치 기준점 (좌측 하단)
  const uw = W - p.bL - p.bR, uh = H - p.bT - p.bB;
  let s = `<svg viewBox="${vx} ${vy} ${vw} ${vh}" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="${t("layout")}">
  <defs><pattern id="hatch" width="${hs}" height="${hs}" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
    <rect width="${hs}" height="${hs}" fill="var(--cell)"/><line x1="0" y1="0" x2="0" y2="${hs}" stroke="var(--hatch)" stroke-width="1" vector-effect="non-scaling-stroke"/></pattern></defs>
  <style>text{font-family:var(--font);fill:var(--muted)} .ns{vector-effect:non-scaling-stroke}</style>
  <rect x="0" y="0" width="${W}" height="${H}" fill="var(--border-area)" stroke="var(--fg)" stroke-width="1.5" class="ns"/>`;
  // 사용 영역 = 기본 잔량색 (재단품·절단 폭이 덮지 않은 부분이 잔량)
  if (uw > 0 && uh > 0) s += `<rect x="${x0}" y="${p.bT}" width="${uw}" height="${uh}" fill="var(--remain)" stroke="var(--remain-line)" stroke-dasharray="4 3" stroke-width="1" class="ns"/>`;

  const blockW = ax.n*qw + (ax.n-1)*cut, blockH = ay.n*qh + (ay.n-1)*cut;
  const kerf = (x, y, w, h) => (w > 0 && h > 0) ? `<rect x="${x}" y="${y}" width="${w}" height="${h}" fill="var(--kerf)" stroke="var(--kerf)" stroke-width="1" class="ns"/>` : "";
  if (L.fit && cut > 0){
    // 열 사이 절단 (+ 우측 잔량 분리 절단)
    for (let i = 0; i < ax.n; i++){
      const kx = x0 + (i+1)*qw + i*cut, last = i === ax.n - 1;
      const w = last ? Math.min(cut, ax.rem) : cut;
      s += kerf(kx, yB - blockH, w, blockH);
    }
    // 행 사이 절단 (+ 상단 잔량 분리 절단, 사용 영역 전체 폭)
    for (let j = 0; j < ay.n; j++){
      const last = j === ay.n - 1, h = last ? Math.min(cut, ay.rem) : cut;
      const ky = yB - (j+1)*qh - j*cut - h;
      s += kerf(x0, ky, last ? uw : blockW, h);
    }
  }
  const showLabel = qw > fs*3.2 && qh > fs*2.6 && total <= 200;
  let k = 0;
  for (let j=0; j<ay.n && k<maxCells; j++) for (let i=0; i<ax.n && k<maxCells; i++, k++){
    const x = x0 + i*(qw + cut), y = yB - (j+1)*qh - j*cut;
    s += `<rect x="${x}" y="${y}" width="${qw}" height="${qh}" fill="url(#hatch)" stroke="${L.fit ? "var(--prod)" : "var(--bad)"}" stroke-width="1.2" class="ns"/>`;
    const mx = qw - L.px, my = qh - L.py;
    if (mx > 0 || my > 0) s += `<rect x="${x + mx/2}" y="${y + my/2}" width="${L.px}" height="${L.py}" fill="none" stroke="var(--prod)" stroke-dasharray="5 3" stroke-width="1" class="ns"/>`;
    if (showLabel){
      s += `<text x="${x+qw/2}" y="${y+qh/2}" text-anchor="middle" font-size="${fs*1.05}" style="fill:var(--fg);font-weight:700">${t("product")}</text>`;
      s += `<text x="${x+qw/2}" y="${y+qh/2+fs*1.2}" text-anchor="middle" font-size="${fs*0.8}">${fmt(L.px)} × ${fmt(L.py)}</text>`;
    }
  }
  // 잔량 표시
  if (L.fit){
    const rx = ax.net, ry = ay.net;
    const lab = (cx, cy, w, h, v, vert) => {
      if (Math.min(w, h) < fs*1.4 || Math.max(w, h) < fs*6) return "";
      const tr = vert ? ` transform="rotate(-90 ${cx} ${cy})"` : "";
      return `<text x="${cx}" y="${cy + fs*0.35}" text-anchor="middle" font-size="${fs*0.9}" style="fill:var(--remain-ink);font-weight:700"${tr}>${t("lgRemain")} ${fmt(v)}</text>`;
    };
    s += lab(x0 + blockW + Math.min(cut, ax.rem) + rx/2, yB - blockH/2, rx, blockH, rx, rx < blockH);
    s += lab(x0 + uw/2, p.bT + ry/2, uw, ry, ry, false);
  }
  const tick = fs*0.45;
  const dimH = (x1,x2,y,label,col) => `<line x1="${x1}" y1="${y}" x2="${x2}" y2="${y}" stroke="${col}" stroke-width="1" class="ns"/>
    <line x1="${x1-tick}" y1="${y+tick}" x2="${x1+tick}" y2="${y-tick}" stroke="${col}" stroke-width="1.4" class="ns"/>
    <line x1="${x2-tick}" y1="${y+tick}" x2="${x2+tick}" y2="${y-tick}" stroke="${col}" stroke-width="1.4" class="ns"/>
    <text x="${(x1+x2)/2}" y="${y-fs*0.4}" text-anchor="middle" font-size="${fs}" style="fill:${col}">${label}</text>`;
  const dimV = (y1,y2,x,label,col,side=-1) => { const tx = side<0 ? x-fs*0.4 : x+fs*1.2; return `<line x1="${x}" y1="${y1}" x2="${x}" y2="${y2}" stroke="${col}" stroke-width="1" class="ns"/>
    <line x1="${x-tick}" y1="${y1+tick}" x2="${x+tick}" y2="${y1-tick}" stroke="${col}" stroke-width="1.4" class="ns"/>
    <line x1="${x-tick}" y1="${y2+tick}" x2="${x+tick}" y2="${y2-tick}" stroke="${col}" stroke-width="1.4" class="ns"/>
    <text x="${tx}" y="${(y1+y2)/2}" text-anchor="middle" font-size="${fs}" transform="rotate(-90 ${tx} ${(y1+y2)/2})" style="fill:${col}">${label}</text>`; };
  s += dimH(0, W, H + pad*0.75, `${t("sheet")} X ${fmt(W)}`, "var(--dim)");
  s += dimV(0, H, -pad*0.55, `${t("sheet")} Y ${fmt(H)}`, "var(--dim)");
  s += dimH(x0, x0 + qw, -pad*0.35, fmt(qw), "var(--cut)");
  s += dimV(yB - qh, yB, W + pad*0.3, fmt(qh), "var(--cut)", 1);
  if (total > maxCells) s += `<text x="${W/2}" y="${H/2}" text-anchor="middle" font-size="${fs*1.4}" style="fill:var(--fg)">${t("maxCells", {n: fmt(maxCells)})}</text>`;
  $("draw").innerHTML = s + `</svg>`;
}

function applyLang(){
  document.documentElement.lang = lang;
  document.querySelectorAll("[data-i18n]").forEach(el => el.textContent = t(el.dataset.i18n));
  document.querySelectorAll("[data-lang]").forEach(b => b.setAttribute("aria-pressed", b.dataset.lang === lang));
  document.title = "BAOS · " + t("title");
  $("cmp").dataset.h = "";
  render();
}

// 입력: 천단위 구분기호는 칸을 벗어날 때 표시
const inputs = IDS.map($);
inputs.forEach((el, i) => {
  el.addEventListener("input", () => { el.value = el.value.replace(/[^\d.,\-]/g, ""); render(); });
  el.addEventListener("blur", () => { const v = parse(el.value); el.value = isFinite(v) ? v.toLocaleString("en-US", {maximumFractionDigits:3}) : ""; });
  el.addEventListener("focus", () => { el.value = el.value.replace(/,/g, ""); el.select(); });
  el.addEventListener("keydown", e => { if (e.key === "Enter"){ e.preventDefault(); (inputs[i+1] || inputs[0]).focus(); } });
});
document.querySelectorAll("input[name=ori]").forEach(r => r.addEventListener("change", render));
window.addEventListener("resize", () => { clearTimeout(window._rz); window._rz = setTimeout(render, 80); });
$("form").addEventListener("submit", e => e.preventDefault());
$("cmp").addEventListener("click", e => {
  const b = e.target.closest("[data-ori]"); if (!b) return;
  document.querySelector(`input[name=ori][value="${b.dataset.ori}"]`).checked = true; render();
});
document.querySelectorAll("[data-lang]").forEach(b => b.addEventListener("click", () => {
  lang = b.dataset.lang; try { localStorage.setItem("baos-lang", lang); } catch(e){} applyLang();
}));
